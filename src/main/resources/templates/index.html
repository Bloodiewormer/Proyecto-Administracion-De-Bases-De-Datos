<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Oracle DB Monitor</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="home-page">
<div class="data-flow" aria-hidden="true"><span class="flow-orbit"></span><span class="flow-blob flow-blob-burgundy"></span><span class="flow-blob flow-blob-teal"></span><span class="flow-blob flow-blob-coral"></span><span class="flow-blob flow-blob-gold"></span><span class="flow-node"></span></div>
<main class="container py-5">
    <div class="row justify-content-center py-md-5">
        <div class="col-12 col-lg-9 col-xl-8">
            <section class="card home-card p-4 p-md-5" aria-labelledby="home-title">
                <h1 id="home-title" class="mb-3">Oracle DB Monitor</h1>
                <p class="lead mb-4">Monitoreo y administración de instancias Oracle</p>
                <p class="text-body-secondary mb-4">Conecte una instancia Oracle para consultar su estado y comenzar el monitoreo.</p>
                <div><a class="btn btn-primary px-4 py-2" th:href="@{/conexion}">Conectar instancia</a></div>
            </section>
        </div>
    </div>
</main>
</body>
</html>
