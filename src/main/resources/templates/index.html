<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Oracle DB Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<main class="container py-5">
    <div class="row justify-content-center py-md-5">
        <div class="col-12 col-lg-9 col-xl-8">
            <section class="card p-4 p-md-5" aria-labelledby="home-title">
                <span class="brand-mark mb-4" aria-hidden="true">DB</span>
                <h1 id="home-title" class="mb-3">Oracle DB Monitor</h1>
                <p class="lead mb-4">Monitoreo y administración de instancias Oracle</p>
                <p class="text-body-secondary mb-4">Conecte una instancia Oracle para consultar su estado y comenzar el monitoreo.</p>
                <div><a class="btn btn-primary px-4 py-2" th:href="@{/conexion}">Conectar instancia <span aria-hidden="true">→</span></a></div>
            </section>
        </div>
    </div>
</main>
</body>
</html>
